name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc \
            make \
            libssl-dev \
            zlib1g-dev \

      - name: Create build directory
        run: mkdir -p build

      - name: Configure the project
        run: cmake -S . -B build

      - name: Build the project
        run: cmake --build build

      - name: Run unit tests
        run: ./build/unit_test

      - name: Run simulations
        run: |
          (./build/main &> /dev/null) & echo "MAIN_PID=$!" >> $GITHUB_ENV
          sleep 5
          ./build/client

      - name: Stop server
        run: kill $MAIN_PID
